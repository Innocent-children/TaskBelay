name: pull-request-validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: macOS arm64 current-platform validation
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up current stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Set up current Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Verify native macOS arm64 runner
        run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64

      - name: Check formal desktop package contracts
        run: node --test release/taskbelay/prepare.test.mjs

      - name: Run bounded repository validation
        run: ./scripts/validate-repository.sh

  desktop-macos:
    name: macOS desktop release compilation
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check native desktop build toolchain
        run: |
          test "$(uname -s)-$(uname -m)" = "Darwin-arm64"
          node --input-type=module -e 'import { verifyMacDesktopToolchain } from "./scripts/build-desktop-pet.mjs"; await verifyMacDesktopToolchain();'

      - name: Compile desktop application
        run: >-
          xcrun swift build --package-path packages/desktop-pet/macos
          --scratch-path "${{ runner.temp }}/desktop-swift"
          --configuration release --arch arm64 -debug-info-format none

  windows-x64:
    name: Windows x64 build contract (CI infrastructure only)
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up current stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Set up current Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v6
        with:
          version: 11
          standalone: true

      - name: Install frozen workspace dependencies
        shell: pwsh
        run: |
          node --input-type=module -e "import { execPortableCommand } from './packages/taskbelay/lib/command.mjs'; const result = await execPortableCommand('pnpm', ['--version'], { encoding: 'utf8' }); process.stdout.write(result.stdout);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the dual-runtime local packages on Windows
        shell: pwsh
        run: node scripts/taskbelay-local.mjs help

      - name: Build native Windows x64 Core
        shell: pwsh
        run: |
          $coreVersion = (Get-Content CORE_VERSION -Raw).Trim()
          $runtime = Join-Path $env:RUNNER_TEMP "taskbelay.exe"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -mod=readonly -trimpath -buildvcs=false -ldflags "-s -w -X github.com/Innocent-children/taskbelay/internal/version.buildVersion=$coreVersion" -o $runtime ./cmd/taskbelay
          "TASKBELAY_WINDOWS_CORE=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (& $runtime version) { } else { exit 1 }

      - name: Run the complete Go suite on Windows
        shell: pwsh
        run: go test ./... -count=1

      - name: Verify Windows CI failure propagation
        shell: pwsh
        run: node --test tests/ci_workflow.test.mjs

      - name: Run Windows Codex package suite
        shell: pwsh
        run: |
          pnpm --dir packages/codex test
          exit $LASTEXITCODE

      - name: Run Windows DeepSeek package suite
        shell: pwsh
        run: |
          pnpm --dir packages/deepseek test
          exit $LASTEXITCODE

      - name: Run Windows lifecycle manager package suite
        shell: pwsh
        run: |
          pnpm --dir packages/taskbelay test
          exit $LASTEXITCODE

      - name: Run Windows ZCode package suite
        shell: pwsh
        run: |
          $env:TASKBELAY_ZCODE_TEST_CORE = $env:TASKBELAY_WINDOWS_CORE
          pnpm --dir packages/zcode test
          exit $LASTEXITCODE

      - name: Check Windows pet renderer logic with simulated DOM and IPC
        shell: pwsh
        run: node --test packages/desktop-pet/windows/tests/renderer.test.cjs

      - name: Run native Windows WebUI lifecycle
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "taskbelay-webui-data"
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:TASKBELAY_DATA_DIR = $data
          $started = & $env:TASKBELAY_WINDOWS_CORE webui start --no-open --json | ConvertFrom-Json
          if ($started.readiness -ne "ready") { throw "WebUI did not become ready" }
          $status = & $env:TASKBELAY_WINDOWS_CORE webui status --json | ConvertFrom-Json
          if ($status.readiness -ne "ready") { throw "WebUI status is not ready" }
          $stopped = & $env:TASKBELAY_WINDOWS_CORE webui stop --json | ConvertFrom-Json
          if ($stopped.readiness -ne "unavailable") { throw "WebUI did not stop" }
