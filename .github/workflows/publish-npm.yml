name: publish-npm

# Keep this file name: the Trusted Publisher of all five npm packages is bound
# to Innocent-children/taskbelay + publish-npm.yml. The build and publish step
# is rewritten with the new implementation; see release/README.md.

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish
        required: true
        type: choice
        options:
          - taskbelay
          - codex
          - deepseek
          - claude
          - zcode
      channel:
        description: npm channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      version:
        description: Exact target version without a v prefix
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_PRODUCT: ${{ inputs.product }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_OUTPUT: ${{ runner.temp }}/taskbelay-release-${{ inputs.product }}-${{ inputs.version }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Create release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Prepare git identity and output directory
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Build, verify and publish selected npm product
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          echo "The release build for $RELEASE_PRODUCT is not implemented in this rewrite yet. See release/README.md." >&2
          exit 1

      - name: Upload release records and artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: npm-release-${{ inputs.product }}-${{ inputs.version }}
          path: ${{ runner.temp }}/taskbelay-release-${{ inputs.product }}-${{ inputs.version }}
          if-no-files-found: ignore
          retention-days: 30
